<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live F1 Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<header class="top-bar">

  <div>

    <h1>
      Mercedes AMG Live F1 Dashboard
    </h1>

    <div id="sessionName">
      Connecting...
    </div>

  </div>

</header>

<main class="dashboard-grid">

  <section class="timing-panel">

    <div class="panel-title">
      Live Timing
    </div>

    <div id="timingTower">
      Loading...
    </div>

  </section>

  <section class="center-panel">

    <div class="track-container">

      <div class="panel-title">
        Live Track Map
      </div>

      <svg id="trackMap" viewBox="0 0 1000 600">

        <path
          id="trackLayout"
          d="M180 300 C250 120 750 120 820 300 C750 480 250 480 180 300"
        ></path>

      </svg>

    </div>

    <div class="driver-focus-container">

      <div class="panel-title">
        Driver Focus
      </div>

      <div id="driverFocusPanel">
        Select Driver
      </div>

    </div>

  </section>

  <section class="right-panel">

    <div class="widget">

      <div class="panel-title">
        Weather
      </div>

      <div id="weatherWidget">
        Loading...
      </div>

    </div>

    <div class="widget">

      <div class="panel-title">
        Race Control
      </div>

      <div id="raceControlWidget">
        Loading...
      </div>

    </div>

    <div class="widget">

      <div class="panel-title">
        Team Radio
      </div>

      <div id="radioWidget">
        Loading...
      </div>

    </div>

  </section>

</main>

<script src="app.js"></script>

</body>
</html>
